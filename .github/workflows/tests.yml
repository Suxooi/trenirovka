name: Logic tests
on:
  pull_request:
    paths: ['index.html', 'sw.js', 'tests/**', '.github/workflows/tests.yml']
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'tests/**', '.github/workflows/tests.yml']
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/regressions.cjs
      - run: node --check sw.js
