# Кладёт в репозиторий распознаватель штрихкодов zxing-wasm (сборка zxing-cpp),
# чтобы приложение не зависело от CDN и работало офлайн.
name: vendor-zxing
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/vendor-zxing.yml']
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скачать пакет
        run: |
          set -e
          mkdir -p /tmp/p && cd /tmp/p
          npm pack zxing-wasm@2 --silent
          tar xzf zxing-wasm-*.tgz
          cd package
          node -e "console.log(require('./package.json').version)" > /tmp/ver
          find dist -maxdepth 3 | sort > /tmp/tree
      - name: Положить в vendor/zxing
        run: |
          set -e
          rm -rf vendor/zxing && mkdir -p vendor/zxing
          P=/tmp/p/package
          cp $P/dist/iife/reader/index.js vendor/zxing/zxing-reader.js
          cp $P/dist/reader/zxing_reader.wasm vendor/zxing/zxing_reader.wasm
          cp $P/LICENSE vendor/zxing/LICENSE
          cp /tmp/ver vendor/zxing/VERSION
          cp /tmp/tree vendor/zxing/TREE.txt
          ( cd $P && find dist/iife/reader dist/es/reader -name '*.d.ts' | head -20 | xargs cat ) > vendor/zxing/types.d.ts.txt || true
          ls -la vendor/zxing
      - name: Коммит
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add vendor/zxing
          git diff --cached --quiet && exit 0
          git commit -m "vendor: zxing-wasm $(cat vendor/zxing/VERSION)"
          git push
